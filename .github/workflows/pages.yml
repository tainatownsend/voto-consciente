name: Publish Voto Consciente preview to GitHub Pages

on:
  push:
    branches:
      - prototype/v3-conversa-direta
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production main
        uses: actions/checkout@v4
        with:
          ref: main
          path: public

      - name: Checkout V3 prototype
        uses: actions/checkout@v4
        with:
          ref: prototype/v3-conversa-direta
          path: prototype

      - name: Add V3 preview without replacing production root
        run: |
          mkdir -p public/preview-v3
          cp prototype/index.html public/preview-v3/index.html
          touch public/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload combined site
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
