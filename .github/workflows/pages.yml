name: Publish Voto Consciente Animated Explainer preview

on:
  push:
    branches:
      - prototype/animated-explainer-v1
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production main
        uses: actions/checkout@v4
        with:
          ref: main
          path: public

      - name: Checkout Animated Explainer prototype
        uses: actions/checkout@v4
        with:
          ref: prototype/animated-explainer-v1
          path: prototype

      - name: Add Animated Explainer preview without replacing production root
        run: |
          mkdir -p public/preview-animated-v1
          cp prototype/preview-animated-v1/index.html public/preview-animated-v1/index.html
          touch public/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload combined site
        uses: actions/upload-pages-artifact@v5
        with:
          path: public
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages-preview
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
