name: Publish Voto Consciente Reels V2 preview

on:
  push:
    branches:
      - prototype/reels-v2-adult-editorial
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production site
        uses: actions/checkout@v4
        with:
          ref: main
          path: site

      - name: Checkout Reels V2 prototype
        uses: actions/checkout@v4
        with:
          ref: prototype/reels-v2-adult-editorial
          path: prototype

      - name: Assemble safe preview artifact
        run: |
          mkdir -p site/preview-reels-v2
          cp -a prototype/preview-reels-v2/. site/preview-reels-v2/
          touch site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          include-hidden-files: true

  deploy:
    needs: build
    environment:
      name: github-pages-preview
      url: ${{ steps.deployment.outputs.page_url }}preview-reels-v2/
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
